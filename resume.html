<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume</title>
  <meta name="description" content="ATS-friendly resume generated from profile.json.">
  <link rel="icon" href="favicon-32x32.png" sizes="32x32">
  <style>
    :root {
      --ink: #111827;
      --muted: #4b5563;
      --rule: #d1d5db;
      --accent: #0e7490;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f3f4f6;
      color: var(--ink);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 10.5pt;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .sheet {
      max-width: 8.5in;
      margin: 24px auto;
      background: #fff;
      padding: 0.7in 0.75in;
      box-shadow: 0 6px 24px rgba(17, 24, 39, 0.12);
    }

    header { border-bottom: 1.5pt solid var(--ink); padding-bottom: 12pt; }

    h1 {
      font-size: 22pt;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .tagline { color: var(--accent); font-size: 11pt; font-weight: 600; margin-top: 3pt; }

    .contact {
      margin-top: 8pt;
      font-size: 9.5pt;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 4pt 10pt;
    }

    .contact a { color: inherit; text-decoration: none; }
    .contact span:not(:last-child)::after { content: " ·"; color: var(--rule); }

    section { margin-top: 16pt; }

    h2 {
      font-size: 10.5pt;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      padding-bottom: 3pt;
      border-bottom: 0.75pt solid var(--rule);
      margin-bottom: 8pt;
    }

    .entry { margin-bottom: 11pt; page-break-inside: avoid; break-inside: avoid; }
    .entry:last-child { margin-bottom: 0; }

    .entry-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10pt;
      flex-wrap: wrap;
    }

    .role { font-size: 11pt; font-weight: 700; }
    .org { font-weight: 600; color: var(--muted); }
    .dates { font-size: 9.5pt; color: var(--muted); white-space: nowrap; }

    ul { margin: 4pt 0 0 14pt; }
    li { margin-bottom: 2.5pt; }

    .tech { margin-top: 4pt; font-size: 9.5pt; color: var(--muted); }

    .skill-row { display: grid; grid-template-columns: 1.6in 1fr; gap: 4pt 10pt; margin-bottom: 4pt; }
    .skill-row dt { font-weight: 700; }
    .skill-row dd { color: var(--muted); }

    .inline-list { color: var(--muted); }
    .blurb { margin-top: 4pt; }

    .print-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(14, 116, 144, 0.35);
    }

    .print-btn:hover { background: #155e75; }

    .back-link {
      position: fixed;
      top: 20px;
      left: 20px;
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
    }

    .back-link:hover { color: var(--accent); }

    @media (max-width: 820px) {
      .sheet { margin: 64px 10px 24px; padding: 24px 20px; }
      .skill-row { grid-template-columns: 1fr; gap: 0; }
      .skill-row dd { margin-bottom: 6pt; }
      .print-btn, .back-link { top: 12px; }
      .print-btn { right: 12px; padding: 8px 14px; }
      .back-link { left: 12px; }
    }

    @media print {
      @page { size: Letter; margin: 0.5in 0.6in; }
      body { background: #fff; font-size: 10pt; }
      .sheet { margin: 0; padding: 0; box-shadow: none; max-width: none; }
      .print-btn, .back-link { display: none !important; }
      h2 { page-break-after: avoid; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">&larr; Portfolio</a>
  <button type="button" class="print-btn" onclick="window.print()">Download PDF</button>

  <main class="sheet" id="resume" aria-busy="true">
    <p>Loading resume…</p>
  </main>

  <script>
    const ACRONYMS = {
      ai: 'AI', ml: 'ML', api: 'API', apis: 'APIs', devops: 'DevOps', ci: 'CI', cd: 'CD', ui: 'UI',
      ai_ml: 'AI & ML', cloud_devops: 'Cloud & DevOps', auth_security: 'Auth & Security'
    };

    const label = key => (ACRONYMS[key.toLowerCase()] || key)
      .split(/[_\s]+/)
      .map(word => ACRONYMS[word.toLowerCase()] || word.replace(/^\w/, character => character.toUpperCase()))
      .join(' ');

    // profile.json keeps **emphasis** markers from the portfolio copy.
    const withEmphasis = (node, text) => {
      text.split(/\*\*(.+?)\*\*/g).forEach((chunk, index) => {
        if (!chunk) return;
        node.append(index % 2 ? el('strong', chunk) : document.createTextNode(chunk));
      });
      return node;
    };

    const el = (tag, text, className) => {
      const node = document.createElement(tag);
      if (text) node.textContent = text;
      if (className) node.className = className;
      return node;
    };

    const section = (heading, ...children) => {
      const node = document.createElement('section');
      node.append(el('h2', heading));
      children.filter(Boolean).forEach(child => node.append(child));
      return node;
    };

    const asList = value => {
      if (Array.isArray(value)) return value.filter(Boolean);
      if (typeof value === 'string' && value.trim()) return [value.trim()];
      return [];
    };

    const bulletList = items => {
      const list = document.createElement('ul');
      items.forEach(item => list.append(withEmphasis(document.createElement('li'), item)));
      return list;
    };

    const entry = ({ role, org, dates, bullets, paragraphs, tech, note }) => {
      const wrapper = el('div', null, 'entry');
      const head = el('div', null, 'entry-head');
      const left = document.createElement('div');
      left.append(el('span', role, 'role'));
      if (org) {
        left.append(document.createTextNode(' — '));
        left.append(el('span', org, 'org'));
      }
      head.append(left);
      if (dates) head.append(el('span', dates, 'dates'));
      wrapper.append(head);
      if (note) wrapper.append(el('div', note, 'tech'));
      const points = asList(bullets);
      if (points.length) wrapper.append(bulletList(points));
      asList(paragraphs).forEach(text => wrapper.append(withEmphasis(el('p', null, 'blurb'), text)));
      const stack = asList(tech);
      if (stack.length) wrapper.append(el('div', `Tech: ${stack.join(', ')}`, 'tech'));
      return wrapper;
    };

    const contactLine = contact => {
      const line = el('div', null, 'contact');
      const parts = [
        contact.email && { text: contact.email, href: `mailto:${contact.email}` },
        contact.phone && { text: contact.phone, href: `tel:${contact.phone.replace(/\s+/g, '')}` },
        contact.location && { text: contact.location },
        contact.linkedin && { text: contact.linkedin, href: `https://${contact.linkedin.replace(/^https?:\/\//, '')}` },
        contact.github && { text: contact.github, href: `https://${contact.github.replace(/^https?:\/\//, '')}` }
      ].filter(Boolean);

      parts.forEach(part => {
        const holder = document.createElement('span');
        if (part.href) {
          const link = el('a', part.text);
          link.href = part.href;
          holder.append(link);
        } else {
          holder.textContent = part.text;
        }
        line.append(holder);
      });
      return line;
    };

    const render = profile => {
      const root = document.getElementById('resume');
      root.textContent = '';
      root.removeAttribute('aria-busy');
      document.title = `${profile.name} — Resume`;

      const header = document.createElement('header');
      header.append(el('h1', profile.name));
      if (profile.title) header.append(el('div', profile.title, 'tagline'));
      if (profile.contact) header.append(contactLine(profile.contact));
      root.append(header);

      if (profile.summary) root.append(section('Summary', withEmphasis(el('p'), profile.summary)));

      const categories = profile.skills?.categories || {};
      if (Object.keys(categories).length) {
        const list = document.createElement('dl');
        Object.entries(categories).forEach(([key, values]) => {
          const row = el('div', null, 'skill-row');
          row.append(el('dt', label(key)));
          row.append(el('dd', (values || []).join(', ')));
          list.append(row);
        });
        root.append(section('Technical Skills', list));
      }

      if (profile.experience?.length) {
        root.append(section('Professional Experience', ...profile.experience.map(job => entry({
          role: job.title,
          org: job.company,
          dates: job.duration,
          bullets: job.description,
          tech: job.tech
        }))));
      }

      if (profile.projects?.length) {
        root.append(section('Selected Projects', ...profile.projects.map(project => entry({
          role: project.name,
          paragraphs: project.description,
          tech: project.tech
        }))));
      }

      if (profile.education?.length) {
        root.append(section('Education', ...profile.education.map(course => entry({
          role: course.name,
          org: course.institution,
          dates: course.year
        }))));
      }

      if (profile.workshops?.length) {
        root.append(section('Talks & Workshops', bulletList(profile.workshops)));
      }

      if (profile.languages?.length) {
        const text = profile.languages
          .map(language => `${language.name} (${language.proficiency})`)
          .join(', ');
        root.append(section('Languages', el('p', text, 'inline-list')));
      }
    };

    const draft = new URLSearchParams(location.search).has('preview')
      ? localStorage.getItem('profile_draft')
      : null;

    if (draft) {
      render(JSON.parse(draft));
    } else {
      fetch('profile.json', { cache: 'no-store' })
        .then(response => {
          if (!response.ok) throw new Error(`profile.json returned ${response.status}`);
          return response.json();
        })
        .then(render)
        .catch(error => {
          document.getElementById('resume').textContent = `Could not load resume: ${error.message}`;
        });
    }
  </script>
</body>
</html>
