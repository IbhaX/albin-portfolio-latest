<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portfolio Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Permanent+Marker&display=swap');
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .animate-bounce {
            animation: bounce 0.5s ease-in-out;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        body {
            background-color: #111827;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .gradient-bg {
            background: linear-gradient(180deg, rgba(17, 24, 39, 1) 0%, rgba(6, 182, 212, 0.1) 100%);
            min-height: 100vh;
        }
        .card {
            background: rgba(31, 41, 55, 0.9);
            border: 1px solid rgba(75, 85, 99, 0.5);
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            width: 100%;
        }
        .btn-primary {
            background-color: #06b6d4;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #0891b2;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.2);
        }
        input[type="text"],
        input[type="password"] {
            background-color: rgba(17, 24, 39, 0.7);
            border: 1px solid #374151;
            color: #f3f4f6;
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            line-height: 1.25rem;
        }
        
        input:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.3);
        }
        
        /* Glitch effect for error messages */
        .glitch {
            position: relative;
            animation: glitch 0.3s linear infinite;
        }
        
        @keyframes glitch {
            0% { text-shadow: 0.05em 0 0 #ff00c1, -0.05em -0.025em 0 #00fff9; }
            14% { text-shadow: 0.05em 0 0 #ff00c1, -0.05em -0.025em 0 #00fff9; }
            15% { text-shadow: -0.05em -0.025em 0 #ff00c1, 0.025em 0.025em 0 #00fff9; }
            49% { text-shadow: -0.05em -0.025em 0 #ff00c1, 0.025em 0.025em 0 #00fff9; }
            50% { text-shadow: 0.025em 0.05em 0 #ff00c1, 0.05em 0 0 #00fff9, 0 -0.05em 0 #ff00c1; }
            99% { text-shadow: 0.025em 0.05em 0 #ff00c1, 0.05em 0 0 #00fff9, 0 -0.05em 0 #ff00c1; }
            100% { text-shadow: -0.025em 0 0 #ff00c1, -0.025em -0.025em 0 #00fff9; }
        }
        
        /* Shake animation for failed attempts */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
            40%, 60% { transform: translate3d(3px, 0, 0); }
        }
        
        /* Flash red effect */
        .flash-red {
            animation: flashRed 0.5s ease-in-out;
        }
        
        @keyframes flashRed {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
            50% { box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.5); }
        }
        input:focus {
            border-color: #06b6d4 !important;
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.3) !important;
        }
        input::placeholder {
            color: #9ca3af !important;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-900">
    <div class="min-h-screen flex flex-col">
        <nav class="bg-gray-900 border-b border-gray-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <a href="index.html" class="text-xl font-bold text-white">Albin Anthony</a>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="index.html" class="text-gray-300 hover:text-white px-3 py-2 text-sm font-medium">Back to Portfolio</a>
                        <button id="logoutBtn" class="hidden text-cyan-400 hover:text-cyan-300 text-sm font-medium flex items-center">
                            <i data-lucide="log-out" class="w-4 h-4 mr-1"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <div class="flex-grow flex items-center justify-center p-4">
            <div class="w-full max-w-md">
                <div class="card p-6 sm:p-8">
            <div class="text-center mb-8">
                <div class="flex justify-center mb-4">
                    <i data-lucide="lock" class="w-10 h-10 sm:w-12 sm:h-12 text-cyan-500"></i>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold text-white mb-2">Welcome Back</h1>
                <p class="text-gray-300 text-sm sm:text-base">Sign in to update your portfolio</p>
            </div>
            
            <div id="error-message" class="hidden mb-6 p-4 bg-red-900/50 border border-red-700 rounded-lg text-red-200 text-sm"></div>
            
            <!-- Attempt Counter -->
            <div id="attempt-counter" class="mb-4 text-center">
                <div class="text-sm text-gray-400 mb-1">
                    <span id="attempt-text">Attempt 0 of 3</span>
                    <span id="lockout-timer" class="ml-2 hidden">
                        • <span id="countdown">0:30</span> until next attempt
                    </span>
                </div>
                <div class="w-full bg-gray-700 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-cyan-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
            
            <form id="loginForm" class="space-y-5">
                <div class="space-y-2">
                    <label for="username" class="block text-sm font-medium text-gray-300">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="user" class="text-gray-400 w-5 h-5"></i>
                        </div>
                        <input type="text" id="username" required
                               class="block w-full"
                               placeholder="Enter your username">
                    </div>
                </div>
                
                <div class="space-y-2">
                    <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="key" class="text-gray-400 w-5 h-5"></i>
                        </div>
                        <input type="password" id="password" required
                               class="block w-full"
                               placeholder="••••••••">
                    </div>
                </div>
                
                <div class="flex items-center justify-between text-sm">
                    <div class="flex items-center">
                        <input id="remember" type="checkbox" class="h-4 w-4 text-cyan-500 focus:ring-cyan-500 border-gray-600 rounded bg-gray-700">
                        <label for="remember" class="ml-2 text-gray-300">Remember me</label>
                    </div>
                    <a href="#" id="forgotPassword" class="text-cyan-400 hover:text-cyan-300 transition-colors">Forgot password?</a>
                </div>
                
                <button type="submit" class="w-full flex justify-center py-2.5 px-4 rounded-lg text-sm font-medium text-white bg-cyan-600 hover:bg-cyan-700 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:ring-offset-2 transition-colors duration-200 mt-4">
                    <i data-lucide="log-in" class="w-4 h-4 mr-2"></i>
                    Sign in
                </button>
                
                <div class="border-t border-gray-700 my-6"></div>
                <p class="text-center text-xs sm:text-sm text-gray-400">
                Need access? 
                <a href="mailto:albin.anthony.dev@gmail.com" class="font-medium text-cyan-400 hover:text-cyan-300 transition-colors">Contact admin</a>
            </p>    </p>
            </form>
                </div>
            </div>
        </div>

        <footer class="py-4 text-center">
            <p class="text-xs text-gray-500">
                &copy; 2025 Albin Anthony. All rights reserved.
            </p>
        </footer>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            // Check auth status and update UI
            checkAuth();
            
            // Add logout button event listener
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    logout();
                });
            }
        });

        // Configuration
        const config = {
            // These are the default credentials - change them to your preferred values
            username: 'admin',
            password: 'admin',
            // Token expiration in milliseconds (24 hours)
            tokenExpiration: 24 * 60 * 60 * 1000,
            // Lockout configuration (in milliseconds)
            lockoutThreshold: 3,  // Number of attempts before lockout starts
            initialLockTime: 30 * 1000,  // 30 seconds
            maxLockTime: 2 * 60 * 60 * 1000,  // 2 hours
            // Evil messages for failed attempts
            evilMessages: [
                "Access Denied. Your IP has been logged.",
                "Incorrect credentials. System defenses engaged.",
                "Unauthorized access attempt detected. This incident will be reported.",
                "You're persistent, aren't you? Security protocols activated.",
                "Final warning: Your activities are being monitored.",
                "System lockout initiated. Authorities have been notified.",
                "You shouldn't be here. This is your last chance.",
                "Malicious activity detected. Countermeasures engaged.",
                "Your digital footprint has been captured.",
                "The system is not your friend. Turn back now."
            ]
        };
        
        let failedAttempts = 0;
        let lockoutTimer = null;
        let lockoutEndTime = localStorage.getItem('lockoutEndTime');
        
        // Check for existing lockout on page load
        document.addEventListener('DOMContentLoaded', () => {
            checkLockout();
        });
        
        // Function to check and handle lockout state
        function checkLockout() {
            if (!lockoutEndTime) return;
            
            const now = Date.now();
            if (now < lockoutEndTime) {
                // Still locked out
                const remaining = Math.ceil((lockoutEndTime - now) / 1000);
                startLockoutTimer(remaining);
            } else {
                // Lockout expired
                clearLockout();
            }
        }
        
        // Function to calculate lockout duration
        function getLockoutDuration(attempts) {
            if (attempts <= config.lockoutThreshold) return 0;
            
            const lockoutStep = attempts - config.lockoutThreshold;
            let lockTime = config.initialLockTime * Math.pow(2, lockoutStep - 1);
            
            // Cap at max lock time
            return Math.min(lockTime, config.maxLockTime);
        }
        
        // Function to start lockout
        function startLockout(duration) {
            const now = Date.now();
            lockoutEndTime = now + duration;
            localStorage.setItem('lockoutEndTime', lockoutEndTime);
            startLockoutTimer(Math.ceil(duration / 1000));
        }
        
        // Function to update the UI during lockout
        function startLockoutTimer(seconds) {
            const form = document.getElementById('loginForm');
            const submitBtn = form.querySelector('button[type="submit"]');
            const attemptText = document.getElementById('attempt-text');
            const lockoutTimerEl = document.getElementById('lockout-timer');
            const countdownEl = document.getElementById('countdown');
            const progressBar = document.getElementById('progress-bar');
            
            // Disable form
            form.querySelectorAll('input, button').forEach(el => {
                el.disabled = true;
                el.classList.add('opacity-50', 'cursor-not-allowed');
            });
            
            // Show lockout UI
            lockoutTimerEl.classList.remove('hidden');
            attemptText.textContent = 'Account locked';
            attemptText.className = 'text-red-400 font-medium';
            
            // Calculate total duration for progress bar
            const totalSeconds = seconds;
            
            // Update timer every second
            const updateTimer = () => {
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = seconds % 60;
                const timeString = `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
                
                // Update countdown display
                countdownEl.textContent = timeString;
                
                // Update progress bar
                const progress = ((totalSeconds - seconds) / totalSeconds) * 100;
                progressBar.style.width = `${progress}%`;
                
                // Color transition for progress bar
                if (progress < 30) {
                    progressBar.className = 'h-2.5 rounded-full transition-all duration-300 bg-red-600';
                } else if (progress < 70) {
                    progressBar.className = 'h-2.5 rounded-full transition-all duration-300 bg-yellow-500';
                } else {
                    progressBar.className = 'h-2.5 rounded-full transition-all duration-300 bg-green-500';
                }
                
                if (seconds > 0) {
                    seconds--;
                    lockoutTimer = setTimeout(updateTimer, 1000);
                } else {
                    clearLockout();
                }
            };
            
            updateTimer();
        }
        
        // Function to clear lockout
        function clearLockout() {
            clearTimeout(lockoutTimer);
            localStorage.removeItem('lockoutEndTime');
            lockoutEndTime = null;
            
            const form = document.getElementById('loginForm');
            if (form) {
                form.querySelectorAll('input, button').forEach(el => {
                    el.disabled = false;
                    el.classList.remove('opacity-50', 'cursor-not-allowed');
                });
                
                // Reset UI elements
                const attemptText = document.getElementById('attempt-text');
                const lockoutTimerEl = document.getElementById('lockout-timer');
                const progressBar = document.getElementById('progress-bar');
                
                if (attemptText) {
                    attemptText.textContent = 'Attempt 0 of 3';
                    attemptText.className = 'text-gray-400';
                }
                
                if (lockoutTimerEl) lockoutTimerEl.classList.add('hidden');
                if (progressBar) progressBar.style.width = '0%';
            }
        }
        
        // Update attempt counter display
        function updateAttemptCounter(attempts) {
            const attemptText = document.getElementById('attempt-text');
            const progressBar = document.getElementById('progress-bar');
            const remainingAttempts = Math.max(0, config.lockoutThreshold - attempts);
            
            if (attempts >= config.lockoutThreshold) {
                attemptText.textContent = 'Account locked';
                attemptText.className = 'text-red-400 font-medium';
            } else {
                attemptText.textContent = `Attempt ${attempts} of ${config.lockoutThreshold}`;
                
                // Change color based on remaining attempts
                if (remainingAttempts <= 1) {
                    attemptText.className = 'text-red-400';
                } else if (remainingAttempts <= 2) {
                    attemptText.className = 'text-yellow-400';
                } else {
                    attemptText.className = 'text-gray-400';
                }
                
                // Update progress bar
                const progress = (attempts / config.lockoutThreshold) * 100;
                progressBar.style.width = `${progress}%`;
                
                // Color transition for progress bar
                if (progress > 66) {
                    progressBar.className = 'h-2.5 rounded-full transition-all duration-300 bg-red-600';
                } else if (progress > 33) {
                    progressBar.className = 'h-2.5 rounded-full transition-all duration-300 bg-yellow-500';
                } else {
                    progressBar.className = 'h-2.5 rounded-full transition-all duration-300 bg-cyan-600';
                }
            }
        }

        // Check URL for logout parameter
        const urlParams = new URLSearchParams(window.location.search);
        const isLogout = urlParams.get('logout') === 'true';
        
        // Clear tokens if logging out
        if (isLogout) {
            localStorage.removeItem('auth_token');
            sessionStorage.removeItem('auth_token');
            // Remove the logout parameter from URL
            window.history.replaceState({}, document.title, window.location.pathname);
        }
        
        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Check if account is locked
            if (lockoutEndTime && Date.now() < lockoutEndTime) {
                const remaining = Math.ceil((lockoutEndTime - Date.now()) / 1000);
                const minutes = Math.floor(remaining / 60);
                const seconds = remaining % 60;
                
                // Update UI to show lockout status
                const attemptText = document.getElementById('attempt-text');
                const lockoutTimerEl = document.getElementById('lockout-timer');
                const countdownEl = document.getElementById('countdown');
                
                attemptText.textContent = 'Account locked';
                attemptText.className = 'text-red-400 font-medium';
                lockoutTimerEl.classList.remove('hidden');
                countdownEl.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                return;
            }
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember').checked;
            const submitBtn = this.querySelector('button[type="submit"]');
            
            // Show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 mr-2 animate-spin"></i> Authenticating...';
            lucide.createIcons();
            
            // Simulate API call
            setTimeout(() => {
                if (username === config.username && password === config.password) {
                    // Successful login
                    failedAttempts = 0; // Reset failed attempts on success
                    const token = generateToken(rememberMe);
                    if (rememberMe) {
                        localStorage.setItem('auth_token', token);
                    } else {
                        sessionStorage.setItem('auth_token', token);
                    }
                    
                    // Clear any lockout on successful login
                    clearLockout();
                    
                    // Show success
                    submitBtn.innerHTML = '<i data-lucide="check" class="w-4 h-4 mr-2"></i> Success!';
                    lucide.createIcons();
                    
                    // Redirect after delay
                    setTimeout(() => {
                        window.location.href = 'update-profile.html';
                    }, 800);
                } else {
                    // Failed login
                    failedAttempts++;
                    updateAttemptCounter(failedAttempts);
                    
                    // Check if we should lock the account
                    const lockoutDuration = getLockoutDuration(failedAttempts);
                    if (lockoutDuration > 0) {
                        startLockout(lockoutDuration);
                    }
                    
                    showError();
                    
                    // Reset form and re-enable button if not locked out
                    if (!lockoutEndTime || Date.now() > lockoutEndTime) {
                        document.getElementById('password').value = '';
                        submitBtn.innerHTML = '<i data-lucide="log-in" class="w-4 h-4 mr-2"></i> Sign In';
                        lucide.createIcons();
                        submitBtn.disabled = false;
                        document.getElementById('password').focus();
                    }
                }
            }, 1000); // Simulate network delay
        });
        
        // Generate a simple token
        function generateToken(rememberMe) {
            const now = new Date();
            const token = {
                user: config.username,
                created: now.getTime(),
                expires: now.getTime() + config.tokenExpiration
            };
            return btoa(JSON.stringify(token));
        }
        
        // Check authentication status
        function checkAuth() {
            const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token');
            if (token) {
                try {
                    const tokenData = JSON.parse(atob(token));
                    const now = new Date().getTime();
                    if (now < tokenData.expires) {
                        // Token is valid
                        document.getElementById('loginForm').classList.add('hidden');
                        document.getElementById('logoutBtn').classList.remove('hidden');
                        return true;
                    }
                } catch (e) {
                    // Invalid token
                    localStorage.removeItem('auth_token');
                    sessionStorage.removeItem('auth_token');
                }
            }
            return false;
        }
        
        // Logout function
        function logout() {
            localStorage.removeItem('auth_token');
            sessionStorage.removeItem('auth_token');
            window.location.href = 'login.html?logout=true';
        }
        
        // Show error message
        function showError() {
            const errorDiv = document.getElementById('error-message');
            const messageIndex = Math.min(failedAttempts - 1, config.evilMessages.length - 1);
            const message = config.evilMessages[messageIndex] || config.evilMessages[config.evilMessages.length - 1];
            
            // Clear any existing timeouts to prevent multiple messages
            if (window.errorTimeout) {
                clearTimeout(window.errorTimeout);
            }
            
            // Reset and show error div
            errorDiv.classList.remove('hidden', 'opacity-0');
            errorDiv.textContent = message;
            errorDiv.classList.add('glitch');
            
            // Add red flash to the form
            const form = document.getElementById('loginForm');
            form.classList.add('flash-red');
            setTimeout(() => form.classList.remove('flash-red'), 500);
            
            // Shake the form for extra effect
            form.classList.add('shake');
            setTimeout(() => form.classList.remove('shake'), 500);
            
            // Auto-hide after 5 seconds
            window.errorTimeout = setTimeout(() => {
                errorDiv.classList.add('opacity-0', 'transition-opacity', 'duration-300');
                setTimeout(() => {
                    errorDiv.classList.add('hidden');
                    errorDiv.classList.remove('opacity-0', 'glitch');
                }, 300);
            }, 5000);
        }
        
        // Handle forgot password
        document.getElementById('forgotPassword').addEventListener('click', function(e) {
            e.preventDefault();
            showError();
            
            // Add a fun effect
            document.documentElement.style.filter = 'hue-rotate(180deg)';
            setTimeout(() => {
                document.documentElement.style.filter = '';
            }, 1000);
        });
        
        // Check if already logged in (only if not logging out)
        document.addEventListener('DOMContentLoaded', () => {
            if (!isLogout && (localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token'))) {
                window.location.href = 'update-profile.html';
            }
        });
    </script>
</body>
</html>
