<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile - Albin's Portfolio</title>
    <!-- Load Tailwind CSS from CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons for the modern look -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Apply the dark theme background */
        body {
            background-color: #111827; /* gray-900 */
            font-family: 'Inter', sans-serif;
            color: #f3f4f6; /* gray-100 */
        }
        
        .gradient-bg {
            background: linear-gradient(180deg, rgba(17, 24, 39, 1) 0%, rgba(6, 182, 212, 0.1) 100%);
            min-height: 100vh;
            width: 100%;
        }
        
        .card {
            background: rgba(31, 41, 55, 0.8); /* gray-800 with opacity */
            border: 1px solid rgba(75, 85, 99, 0.5); /* gray-600 with opacity */
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .btn-primary {
            background-color: #06b6d4; /* cyan-500 */
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background-color: #0891b2; /* cyan-600 */
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.2);
        }
        
        input, textarea, select {
            background-color: rgba(17, 24, 39, 0.7) !important;
            border-color: #374151 !important; /* gray-700 */
            color: #f3f4f6 !important; /* gray-100 */
        }
        
        input:focus, textarea:focus, select:focus {
            border-color: #06b6d4 !important; /* cyan-500 */
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.3) !important;
            outline: none;
        }
        
        input::placeholder, textarea::placeholder {
            color: #9ca3af !important; /* gray-400 */
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1f2937; /* gray-800 */
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #4b5563; /* gray-600 */
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280; /* gray-500 */
        }
    </style>
</head>
<body class="min-h-screen p-6">
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-gray-900 bg-opacity-90 flex items-center justify-center z-50">
        <div class="text-center">
            <div class="w-16 h-16 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-gray-300">Loading...</p>
        </div>
    </div>
    
    <!-- Navigation -->
    <nav class="flex justify-between items-center mb-8">
        <a href="index.html" class="text-cyan-400 hover:text-cyan-300 flex items-center">
            <i data-lucide="arrow-left" class="w-5 h-5 mr-1"></i> Back to Portfolio
        </a>
        <button id="logoutBtn" class="flex items-center text-red-400 hover:text-red-300">
            <i data-lucide="log-out" class="w-5 h-5 mr-1"></i> Logout
        </button>
    </nav>
    <div class="max-w-5xl mx-auto card p-8">
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <i data-lucide="user-cog" class="w-12 h-12 text-cyan-500"></i>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Update Your Profile</h1>
            <p class="text-gray-300">Make changes to your portfolio information</p>
        </div>
        
        <form id="profileForm" class="space-y-8">
            <!-- Basic Information -->
            <div class="bg-gray-800/50 p-6 rounded-lg mb-8">
                <h2 class="text-xl font-semibold mb-4 text-cyan-400 flex items-center">
                    <i data-lucide="user" class="w-5 h-5 mr-2"></i>
                    Basic Information
                </h2>
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" id="name" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Professional Title</label>
                        <input type="text" id="title" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Professional Summary</label>
                        <textarea id="summary" rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                    </div>
                </div>
            </div>

            <!-- Contact Information -->
            <div class="bg-gray-800/50 p-6 rounded-lg mb-8">
                <h2 class="text-xl font-semibold mb-4 text-cyan-400 flex items-center">
                    <i data-lucide="contact" class="w-5 h-5 mr-2"></i>
                    Contact Information
                </h2>
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="email" class="w-full px-4 py-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                        <input type="tel" id="phone" class="w-full px-4 py-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
                        <input type="text" id="location" class="w-full px-4 py-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">LinkedIn</label>
                        <input type="url" id="linkedin" class="w-full px-4 py-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">GitHub</label>
                        <input type="url" id="github" class="w-full px-4 py-2 border border-gray-300 rounded-md">
                    </div>
                </div>
            </div>

            <!-- Skills -->
            <div class="bg-gray-800/50 p-6 rounded-lg mb-8">
                <h2 class="text-xl font-semibold mb-4 text-cyan-400 flex items-center">
                    <i data-lucide="award" class="w-5 h-5 mr-2"></i>
                    Skills
                </h2>
                <div id="skillsContainer">
                    <!-- Skills will be dynamically added here -->
                </div>
                <button type="button" onclick="addSkillCategory()" class="mt-4 px-4 py-2 bg-blue-100 text-blue-700 rounded-md hover:bg-blue-200 transition-colors">
                    <i class="fas fa-plus mr-2"></i>Add Skill Category
                </button>
            </div>

            <!-- Experience -->
            <div class="bg-gray-800/50 p-6 rounded-lg mb-8">
                <h2 class="text-xl font-semibold mb-4 text-cyan-400 flex items-center">
                    <i data-lucide="briefcase" class="w-5 h-5 mr-2"></i>
                    Work Experience
                </h2>
                <div id="experienceContainer">
                    <!-- Experience items will be dynamically added here -->
                </div>
                <button type="button" onclick="addExperience()" class="mt-4 px-4 py-2 bg-blue-100 text-blue-700 rounded-md hover:bg-blue-200 transition-colors">
                    <i class="fas fa-plus mr-2"></i>Add Experience
                </button>
            </div>

            <div class="flex justify-end space-x-4 pt-6 border-t border-gray-700">
                <button type="button" onclick="loadProfile()" class="px-6 py-2 border border-gray-600 rounded-md text-gray-200 hover:bg-gray-700 transition-colors">
                    <i data-lucide="rotate-ccw" class="w-4 h-4 mr-2 inline"></i> Reset
                </button>
                <button type="submit" class="px-6 py-2 bg-cyan-600 text-white rounded-md hover:bg-cyan-700 transition-colors flex items-center">
                    <i data-lucide="save" class="w-4 h-4 mr-2"></i>
                    Save Changes
                </button>
            </div>
        </form>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Check if Ctrl key is pressed
            if (e.ctrlKey) {
                // Prevent default browser behavior for these shortcuts
                e.preventDefault();
                
                // Ctrl + S - Save form
                if (e.key === 's' || e.key === 'S') {
                    document.getElementById('profileForm').dispatchEvent(new Event('submit'));
                }
                // Ctrl + B - Go back to homepage
                else if (e.key === 'b' || e.key === 'B') {
                    window.location.href = 'index.html';
                }
                // Ctrl + R - Reset form
                else if (e.key === 'r' || e.key === 'R') {
                    loadProfile();
                }
            }
        });

        // Check authentication status on page load
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token');
            
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            // Verify token
            if (!verifyToken(token)) {
                localStorage.removeItem('auth_token');
                sessionStorage.removeItem('auth_token');
                window.location.href = 'login.html';
                return;
            }

            // Show the content
            document.getElementById('loadingOverlay').style.display = 'none';
            document.body.style.overflow = 'auto';

            // Load profile after authentication
            if (window.loadProfile) {
                loadProfile();
            }
        });

        // Logout function
        window.logout = function() {
            localStorage.removeItem('auth_token');
            sessionStorage.removeItem('auth_token');
            // Add a parameter to indicate logout
            window.location.href = 'login.html?logout=true';
        };
        
        // Add event listener to logout button
        document.addEventListener('DOMContentLoaded', function() {
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    logout();
                });
            }
        });

        // Function to verify token
        function verifyToken(token) {
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                // Check if token is expired
                if (payload.exp < Date.now() / 1000) {
                    console.log('Token expired');
                    return false;
                }
                return true;
            } catch (e) {
                console.error('Token verification failed:', e);
                return false;
            }
        }
    </script>
    
    <script src="profile-editor.js"></script>
</body>
</html>
