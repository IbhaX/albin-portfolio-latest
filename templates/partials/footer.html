<footer class="bg-gray-950 text-white p-8 md:p-10 text-center border-t border-cyan-900">
    <p class="text-sm text-gray-400 text-center">
        Developed with Django & Tailwind CSS. {{ site_settings.owner_name|default:"ALBIN ANTHONY" }} © {% now "Y" %}
    </p>
    <div class="flex justify-center space-x-6 mt-4">
        <a href="mailto:{{ site_settings.owner_email|default:"albin.anthony.dev@gmail.com" }}" class="text-cyan-400 hover:text-cyan-300 transition">Contact</a>
        <span class="text-gray-600">|</span>
        {% if site_settings.linkedin_url %}
        <a href="{{ site_settings.linkedin_url }}" target="_blank" rel="noopener noreferrer" class="text-cyan-400 hover:text-cyan-300 transition">LinkedIn</a>
        <span class="text-gray-600">|</span>
        {% endif %}
        {% if site_settings.github_url %}
        <a href="{{ site_settings.github_url }}" target="_blank" rel="noopener noreferrer" class="text-cyan-400 hover:text-cyan-300 transition">GitHub</a>
        <span class="text-gray-600">|</span>
        {% endif %}
        <a href="{% url 'blog:post_list' %}" class="text-cyan-400 hover:text-cyan-300 transition">Blog</a>
    </div>
</footer>
