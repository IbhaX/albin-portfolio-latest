{% extends 'base.html' %}

{% block title %}Delete Post - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-12">
    <div class="bg-gray-800/70 rounded-xl p-8 border border-gray-700">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-red-600/20 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="trash-2" class="w-8 h-8 text-red-400"></i>
            </div>
            <h1 class="text-2xl font-bold text-white mb-2">Delete Post?</h1>
            <p class="text-gray-400">This action cannot be undone.</p>
        </div>
        
        <div class="bg-gray-900/50 rounded-lg p-4 mb-6">
            <h2 class="text-lg font-medium text-white mb-1">{{ post.title }}</h2>
            <p class="text-gray-400 text-sm">Created {{ post.created_at|date:"M d, Y" }}</p>
        </div>
        
        <form method="post" class="flex items-center justify-center gap-4">
            {% csrf_token %}
            <a href="{% url 'blog:my_posts' %}" class="px-6 py-3 bg-gray-700 hover:bg-gray-600 text-white rounded-lg transition-colors">
                Cancel
            </a>
            <button type="submit" class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-medium rounded-lg transition-colors flex items-center gap-2">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
                Yes, Delete Post
            </button>
        </form>
    </div>
</div>
{% endblock %}
