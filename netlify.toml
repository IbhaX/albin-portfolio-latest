[build]
  publish = "."
  functions = "netlify/functions"

# The publish dir is the repo root, so netlify/functions/*.mjs would otherwise
# be served as static files. Block direct access; functions still run at
# /.netlify/functions/<name>.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
